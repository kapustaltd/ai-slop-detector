schema_version: rubric.v1
rubric_version: frontend.v1
area: frontend
scale:
  max: 10
  anchors: [2, 5, 8, 10]
area_weights:
  backend: 0.5
  frontend: 0.5
categories:
  - id: component_architecture
    name: Компонентная архитектура
    weight: 0.20
    subcategories:
      - id: decomposition
        name: Декомпозиция
        weight: 0.60
        metrics:
          - {id: component_design, name: Декомпозиция и переиспользование, description: Размер и ответственность компонентов вместе с переиспользованием вместо копирования, weight: 1.00, anchors: {"2": Компоненты перегружены UI массово копируется, "5": Основные границы выделены общие элементы частично выделены, "8": Ответственности разделены повторения сведены к общим компонентам, "10": Декомпозиция поддерживает изменения система компонентов расширяема}}
      - id: code_organization
        name: Организация кода
        weight: 0.40
        metrics:
          - {id: code_structure_and_concerns, name: Структура и разделение ответственности, description: Предсказуемость структуры и именования вместе с разделением представления логики и доступа к данным, weight: 1.00, anchors: {"2": Структура хаотична всё смешано в компонентах, "5": Основные части понятны есть отдельные границы, "8": Структура предсказуема слои ответственности ясны, "10": Структура последовательно поддерживается изменения локализуются предсказуемо}}
  - id: state_data_management
    name: Управление состоянием и данными
    weight: 0.16
    subcategories:
      - id: state
        name: Состояние
        weight: 0.60
        metrics:
          - {id: state_management, name: Размещение и предсказуемость состояния, description: Локальное против глобального и уровень подъёма состояния вместе с единственным источником истины, weight: 1.00, anchors: {"2": Состояние размещено случайно UI легко рассинхронизируется, "5": Основные состояния работают основные источники понятны, "8": Уровень состояния выбран по ответственности источники истины едины, "10": Состояние минимально и прозрачно переходы состояния формально ясны}}
      - id: server_data
        name: Работа с сервером
        weight: 0.40
        metrics:
          - {id: data_fetching, name: Получение данных, description: Организация запросов кеширование и инвалидация, weight: 0.60, anchors: {"2": Запросы разбросаны и дублируются, "5": Основные запросы организованы, "8": Кеш и обновление предсказуемы, "10": Поток данных эффективен и объясним}}
          - {id: async_states, name: Асинхронные состояния, description: Состояния загрузки ошибок и пустых данных, weight: 0.40, anchors: {"2": Состояния не обработаны, "5": Учтены основные ошибки, "8": Все пользовательские состояния видимы, "10": Состояния единообразны и доступны}}
  - id: typing_contracts
    name: Типизация и контракты
    weight: 0.14
    subcategories:
      - id: type_strictness
        name: Строгость типов
        weight: 0.60
        metrics:
          - {id: type_strictness, name: Строгость типов, description: Strict-режим и отсутствие немотивированных any, weight: 0.60, anchors: {"2": Типы обходятся повсеместно, "5": Критичные места типизированы, "8": Типы покрывают границы, "10": Типизация предотвращает классы ошибок}}
          - {id: api_types, name: Типы API, description: Типы данных API происходят из контракта, weight: 0.40, anchors: {"2": Данные описаны вручную и расходятся, "5": Типы частично связаны с контрактом, "8": Границы выводятся из контракта, "10": Дрейф типов проверяется автоматически}}
      - id: component_boundaries
        name: Границы компонентов
        weight: 0.40
        metrics:
          - {id: props_contracts, name: Контракты props, description: Типизация props и публичных интерфейсов модулей, weight: 1.00, anchors: {"2": Интерфейсы неясны, "5": Основные props типизированы, "8": Публичные границы ясны, "10": Контракты делают компоненты безопасно переиспользуемыми}}
  - id: performance
    name: Производительность
    weight: 0.12
    subcategories:
      - id: rendering
        name: Рендеринг
        weight: 0.60
        metrics:
          - {id: render_efficiency, name: Эффективность рендеринга, description: Лишние перерисовки и оправданная мемоизация, weight: 1.00, anchors: {"2": Рендеринг явно избыточен, "5": Основные проблемы отсутствуют, "8": Обновления локализованы, "10": Рендеринг измерен и устойчив}}
      - id: loading
        name: Загрузка
        weight: 0.40
        metrics:
          - {id: bundle_and_assets, name: Бандл и ассеты, description: Размер бандла код-сплиттинг и работа с изображениями, weight: 1.00, anchors: {"2": Загрузка неоправданно тяжёлая, "5": Базовая оптимизация есть, "8": Крупные части загружаются по необходимости, "10": Производительность загрузки системно контролируется}}
  - id: accessibility
    name: Доступность
    weight: 0.12
    subcategories:
      - id: semantics
        name: Семантика
        weight: 0.55
        metrics:
          - {id: semantic_accessibility, name: Семантика и ARIA, description: Семантические элементы вместо div-супа вместе с ARIA там где семантики не хватает, weight: 1.00, anchors: {"2": Семантика мешает пониманию ARIA используется случайно, "5": Основные элементы семантичны критичные места дополнены ARIA, "8": Разметка соответствует назначению ARIA применена по назначению, "10": Семантика и ARIA согласованно улучшают навигацию и поддержку}}
      - id: interaction
        name: Взаимодействие
        weight: 0.45
        metrics:
          - {id: keyboard_navigation, name: Навигация с клавиатуры, description: Доступность с клавиатуры и порядок фокуса, weight: 0.60, anchors: {"2": Основные действия недоступны, "5": Работают базовые сценарии, "8": Фокус и клавиатура последовательны, "10": Все интеракции полностью доступны}}
          - {id: contrast_and_focus, name: Контраст и фокус, description: Контраст и видимость фокуса, weight: 0.40, anchors: {"2": Фокус или контраст отсутствуют, "5": Основные элементы различимы, "8": Состояния видимы, "10": Визуальная доступность выдержана системно}}
  - id: ui_style_consistency
    name: Консистентность UI и стилей
    weight: 0.12
    subcategories:
      - id: style_system
        name: Система стилей
        weight: 0.60
        metrics:
          - {id: styling_consistency, name: Подход к стилям и консистентность, description: Единый подход к стилям и токены вместо магических значений вместе с единообразием однотипных элементов, weight: 1.00, anchors: {"2": Стили случайны и дублируются одинаковые элементы выглядят по-разному, "5": Основные правила повторяются большинство экранов согласованы, "8": Есть единая система компоненты визуально едины, "10": Токены и система делают расхождения редкими и поддерживают масштабирование}}
      - id: responsiveness
        name: Адаптивность
        weight: 0.40
        metrics:
          - {id: responsiveness, name: Адаптивность, description: Поведение на разных размерах экрана, weight: 1.00, anchors: {"2": Узкие экраны ломают сценарии, "5": Основные размеры работают, "8": Макет устойчив на типовых устройствах, "10": Адаптивность продумана для всех ключевых состояний}}
  - id: testing
    name: Тестирование
    weight: 0.14
    subcategories:
      - id: test_content
        name: Содержание тестов
        weight: 0.60
        metrics:
          - {id: test_quality_and_coverage, name: Покрытие и качество тестов, description: Покрыты ли тестами ключевые сценарии интерфейса вместе с устойчивостью тестов и отсутствием завязки на случайную разметку, weight: 1.00, anchors: {"2": Ключевые сценарии не проверяются тесты хрупки, "5": Проверены базовые сценарии тесты проверяют happy path, "8": Основные риски покрыты тесты устойчивы к рефакторингу, "10": Тесты защищают пользовательские инварианты набор тестов быстро объясняет поведение}}
      - id: test_runnability_area
        name: Запускаемость
        weight: 0.40
        metrics:
          - {id: test_runnability, name: Запускаемость тестов, description: Воспроизводимость запуска тестов, weight: 1.00, anchors: {"2": Тесты не запускаются, "5": Запуск требует ручных действий, "8": Запуск описан и воспроизводим, "10": Запуск стабилен с чистого окружения}}
