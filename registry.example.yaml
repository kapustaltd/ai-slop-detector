# Реестр команд, который ведут организаторы (спека 003 FR-006).
# Команды ничего не сабмитят: ссылки и ветки заполняются здесь вручную.
version: "1"
teams:
  - id: team-01
    name: Команда 01
    repo: https://github.com/example/team-01.git
    branch: main
    active: true
    # Необязательно: если область лежит в подпапке, укажите относительный путь.
    paths:
      backend: backend
      frontend: frontend

# Клоны репозиториев складываются вне дерева проекта — по умолчанию ../teams-repos/
# (флаг --workspace). Внутри проекта их держать нельзя: файлы инструкций из репозитория
# команды попали бы в контекст как указания (принцип IV конституции, FR-007a).
